---
layout: default
---

<div class="post">

  <header class="post-header">
    <h1>{{ page.title }}</h1>

    <p class="meta">
      {{ page.date | date: "%b %-d, %Y" }}
      {% if page.author %} • {{ page.author }}{% endif %}
      {% if page.meta %} • {{ page.meta }}{% endif %}
    </p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  <!-- MathJax -->
  {% if page.mathjax %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)']
        ],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        skipHtmlTags: [
          'script', 'noscript', 'style',
          'textarea', 'pre', 'code'
        ]
      }
    };
  </script>

  <script defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>
  {% endif %}

  <!-- Giscus Comments -->
  {% if page.comments %}
  <div class="post-comments"
       style="margin-top: 50px;
              padding-top: 20px;
              border-top: 1px solid #e5e5e5;">

    <h2>Comments</h2>

    <script
      src="https://giscus.app/client.js"
      data-repo="MINELLO6/MINELLO6.github.io"
      data-repo-id="R_kgDOMOuo1A"
      data-category="Announcements"
      data-category-id="DIC_kwDOMOuo1M4DIU2y"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="light"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>

  </div>
  {% endif %}

</div>
